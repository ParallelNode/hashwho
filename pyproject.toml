[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hashwho"
version = "1.0.0"
description = "Identify a hash and get the exact hashcat -m / john --format command to crack it. 110+ types, zero dependencies, single file."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ParallelNode" }]
keywords = ["hash", "hashcat", "john", "security", "ctf", "pentesting", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/ParallelNode/hashwho"
Issues = "https://github.com/ParallelNode/hashwho/issues"

[project.scripts]
hashwho = "hashwho:main"

[tool.hatch.build.targets.wheel]
include = ["hashwho.py", "hashwho_data.json"]

[tool.hatch.build.targets.sdist]
include = ["hashwho.py", "hashwho_data.json", "test_hashwho.py", "README.md", "CHANGELOG.md", "LICENSE"]
